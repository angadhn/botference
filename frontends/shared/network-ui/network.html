<!doctype html>
<html lang="en" data-scheme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project connections · Botference</title><link rel="stylesheet" href="/network-assets/network.css"></head>
<body>
<svg id="map" role="img" aria-label="Map of projects and the connections between them"></svg>
<header class="top">
  <a href="/" class="home" title="Back to Botference" aria-label="Back to Botference">←</a>
  <div class="where">
    <h1><button id="overview" type="button" title="Back to all projects (Esc)">Project connections</button><span id="focus-name"></span></h1>
    <p id="status" role="status">Loading project records…</p>
  </div>
</header>
<nav class="tools" aria-label="Map tools">
  <select id="root" aria-label="Council" hidden></select>
  <input id="search" type="search" placeholder="find  /" aria-label="Find a project, reading or output" autocomplete="off">
  <label class="tog sug" title="Show agent suggestions (S)"><input type="checkbox" id="suggestions" checked><span>suggested</span></label>
  <label class="tog dis" title="Show dismissed connections (D)"><input type="checkbox" id="dismissed"><span>dismissed</span></label>
  <label class="tog" title="Show archived projects (A)"><input type="checkbox" id="archived"><span>archived</span></label>
  <button id="fit" type="button" title="Fit everything in view (F)">fit</button>
  <button id="refresh" type="button" title="Re-read files and look for new suggestions">refresh</button>
  <button id="scheme" type="button" title="Light or dark (T)" aria-label="Switch between light and dark">◐</button>
</nav>
<div id="empty" hidden></div>
<p class="caption">Closeness on this map is only arrangement. It does not measure similarity.</p>
<div id="tip" role="tooltip" hidden></div>
<aside id="detail" class="sheet" aria-live="polite" aria-label="Details"></aside>
<script type="module" src="/network-assets/network.js"></script></body></html>
